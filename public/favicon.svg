<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background (optional, but good for dark browser tabs) -->
  <rect width="64" height="64" rx="12" fill="#0F172A" />
  
  <!-- Bearish Candle (Red) -->
  <rect x="12" y="24" width="14" height="24" fill="#EF4444" rx="2" />
  <line x1="19" y1="10" x2="19" y2="24" stroke="#EF4444" stroke-width="3" />
  <line x1="19" y1="48" x2="19" y2="54" stroke="#EF4444" stroke-width="3" />
  
  <!-- Bullish Candle (Green) -->
  <rect x="34" y="32" width="14" height="18" fill="#22C55E" rx="2" />
  <line x1="41" y1="20" x2="41" y2="32" stroke="#22C55E" stroke-width="3" />
  <line x1="41" y1="50" x2="41" y2="54" stroke="#22C55E" stroke-width="3" />
  
  <!-- Moving Average Line (Gold accent) -->
  <polyline points="12,48 20,36 32,44 44,30 52,38" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>